[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dnd-rules-attorney"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3",
    "fastapi>=0.162",
    "numpy>=2.5",
    "ollama>=0.6",
    "pydantic>=2.14",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
dev = ["bm25s>=0.3", "mypy", "pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["bm25s", "bm25s.*"]
ignore_missing_imports = true

